# This is a single-package repo, not a real pnpm workspace: packages is deliberately empty. The file exists to carry pnpm settings.
packages: []
# Every development dependency add or update writes an exact version, never a range: a floating range lets a routine `pnpm install` silently resolve to a version nobody has reviewed. The runtime dependencies of the published package are the exception and use caret ranges (add them with `--save-exact=false`): an exact pin would stop a consumer taking a patch without a new release here, and would install a second copy beside any other version of the same package, so `instanceof` on its classes would fail across the copies.
minimumReleaseAgeExclude:
  - cosmiconfig-extends
saveExact: true
# @semantic-release/release-notes-generator tries to load its preset from its own location before the project's, and pnpm's private hoisting there offers only the newest conventional-changelog-conventionalcommits in the tree, 10.x (through @commitlint/config-conventional), whose writer 9 requirement the generator's writer 8 cannot meet. Declaring the 9.x preset as the generator's own dependency puts it next to the generator, so it is found first. The same version is pinned as a direct devDependency in package.json; keep the two in step.
packageExtensions:
  '@semantic-release/release-notes-generator':
    dependencies:
      conventional-changelog-conventionalcommits: 9.3.1
